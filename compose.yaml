services:
  postgres:
    image: postgres:16
    container_name: olist-project2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: olist_project2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: olist_pass
    ports:
      - "5432:5432"
    volumes:
      - olist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olist_project2"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  olist_postgres_data:
