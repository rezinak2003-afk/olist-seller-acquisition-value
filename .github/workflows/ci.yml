name: data-pipeline-ci

on:
  push:
  pull_request:

jobs:
  test-and-reconcile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["2.2.*", "3.0.*"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: olist_pass
          POSTGRES_DB: olist_project2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d olist_project2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:olist_pass@localhost:5432/olist_project2
      OLIST_RAW_DIR: tests/fixtures/synthetic_olist
      OLIST_OUTPUT_DIR: .ci-data/processed
      OLIST_REFERENCE_DIR: tests/fixtures/synthetic_olist
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install base dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Select pandas matrix version
        run: pip install --force-reinstall "pandas==${{ matrix.pandas }}"
      - name: Unit tests
        run: pytest -q -m "not integration"
      - name: Run full pipeline on committed synthetic fixture
        run: python -m src.pipeline
      - name: Execute PostgreSQL 16 and compare every mart field
        run: python scripts/run_postgres.py
      - name: Require all SQL/Python reconciliation rows to PASS
        run: python -c "import pandas as p; d=p.read_csv('.ci-data/processed/sql_python_reconciliation.csv'); assert len(d)>0 and d.status.eq('PASS').all(), d.loc[~d.status.eq('PASS')].to_string(index=False)"
      - name: Integration tests
        run: pytest -q -m integration
